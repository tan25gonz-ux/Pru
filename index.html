<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket 80mm - Pruebas</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0f0f0; margin: 0; padding: 15px; }
  .app { max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  @media (max-width: 820px) { .app { grid-template-columns: 1fr; } }
  .panel { background: #fff; padding: 14px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .panel h2 { margin: 0 0 10px; font-size: 15px; color: #222; }
  .panel label { font-size: 11px; color: #555; display: block; margin-top: 6px; font-weight: bold; }
  .panel input, .panel select, .panel textarea {
    width: 100%; padding: 6px; margin-top: 2px; border: 1px solid #ccc;
    border-radius: 4px; font-size: 13px; font-family: inherit;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  table.items { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
  table.items th { background: #f4f4f4; padding: 5px; border: 1px solid #ddd; text-align: left; }
  table.items td { padding: 3px; border: 1px solid #ddd; }
  table.items input { margin: 0; padding: 3px; font-size: 12px; }
  table.items .num { text-align: right; }
  .btn {
    padding: 11px 14px; border: none; border-radius: 6px; cursor: pointer;
    font-size: 14px; font-weight: bold; margin: 4px 3px; color: #fff;
  }
  .btn-blue { background: #2563eb; }
  .btn-orange { background: #ea580c; }
  .btn-gray { background: #555; }
  .btn-sm { padding: 4px 8px; font-size: 11px; margin: 0; }
  .btn:active { transform: scale(.97); }
  .ticket-wrap {
    background: #d0d0d0; padding: 15px; border-radius: 8px;
    display: flex; justify-content: center; overflow-x: auto;
  }
  .ticket {
    background: #fff; width: 80mm; padding: 3mm 4mm;
    font-family: 'Courier New', Courier, monospace;
    font-size: 11px; line-height: 1.25; color: #000;
    box-shadow: 0 0 4px rgba(0,0,0,.2);
  }
  .ticket div { white-space: pre; }
  .ticket img.sig { display: block; margin: 6px auto; max-width: 60mm; max-height: 22mm; }
  .hint { font-size: 11px; color: #666; margin-top: 8px; }

  @page { size: 80mm auto; margin: 0; }
  @media print {
    body { background: #fff; margin: 0; padding: 0; }
    body * { visibility: hidden; }
    .ticket, .ticket * { visibility: visible; }
    .ticket {
      position: absolute; left: 0; top: 0;
      width: 72mm; padding: 2mm 3mm;
      box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .ticket div { font-size: 10.5px; line-height: 1.3; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- ============ FORMULARIO ============ -->
  <div>
    <div class="panel">
      <h2>🏪 Datos del negocio</h2>
      <label>Nombre</label>
      <input id="bizName" value="MI TIENDA S.A.">
      <div class="row">
        <div>
          <label>Cedula juridica</label>
          <input id="bizId" value="3-101-123456">
        </div>
        <div>
          <label>Telefono</label>
          <input id="bizPhone" value="8888-8888">
        </div>
      </div>
      <label>Direccion</label>
      <input id="bizAddr" value="San Jose, Costa Rica">
    </div>

    <div class="panel" style="margin-top:15px;">
      <h2>🧾 Datos de la factura</h2>
      <div class="row">
        <div>
          <label>No. Factura</label>
          <input id="invNum" value="001-0000123">
        </div>
        <div>
          <label>Fecha</label>
          <input id="invDate" type="date">
        </div>
      </div>
      <label>Cliente</label>
      <input id="cliName" value="Cliente de Prueba">
      <div class="row">
        <div>
          <label>Cedula cliente</label>
          <input id="cliId" value="1-1111-1111">
        </div>
        <div>
          <label>Telefono cliente</label>
          <input id="cliPhone" value="7777-7777">
        </div>
      </div>
      <label>Metodo de pago</label>
      <select id="payMethod">
        <option>Efectivo</option>
        <option>Tarjeta</option>
        <option>SINPE Movil</option>
        <option>Transferencia</option>
      </select>
      <div class="row">
        <div>
          <label>Monto recibido (efectivo)</label>
          <input id="cashIn" type="number" step="0.01" value="0">
        </div>
        <div>
          <label>IVA %</label>
          <input id="taxRate" type="number" step="0.01" value="13">
        </div>
      </div>
    </div>

    <div class="panel" style="margin-top:15px;">
      <h2>📦 Productos / Servicios</h2>
      <table class="items">
        <thead>
          <tr>
            <th>Descripcion</th>
            <th style="width:50px;">Cant</th>
            <th style="width:80px;">Precio</th>
            <th style="width:32px;"></th>
          </tr>
        </thead>
        <tbody id="itemsBody"></tbody>
      </table>
      <button class="btn btn-gray btn-sm" style="margin-top:8px;" onclick="addItem()">+ Agregar linea</button>
    </div>

    <div class="panel" style="margin-top:15px;">
      <h2>✍️ Firma digital (opcional)</h2>
      <label>Subir imagen de firma</label>
      <input type="file" id="sigFile" accept="image/*">
      <button class="btn btn-gray btn-sm" onclick="clearSig()">Quitar firma</button>
    </div>
  </div>

  <!-- ============ PREVIEW / BOTONES ============ -->
  <div>
    <div class="panel">
      <button class="btn btn-blue" onclick="window.print()">🖨️ Imprimir Ticket</button>
      <button class="btn btn-orange" onclick="copyTicket()">📋 Copiar Texto</button>
      <div class="hint">
        En el dialogo: impresora <b>RawBT</b> (o la MPR-300 directa), papel <b>80mm</b>,
        margenes <b>Ninguno</b>, escala <b>100%</b>.
      </div>
    </div>

    <div class="ticket-wrap" style="margin-top:15px;">
      <div class="ticket" id="ticket"></div>
    </div>
  </div>
</div>

<script>
const W = 42;

function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function stripAccents(s) {
  return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function clean(s) { return stripAccents(s); }

function center(text) {
  text = clean(text);
  if (text.length >= W) text = text.slice(0, W);
  const pad = Math.floor((W - text.length) / 2);
  return ' '.repeat(pad) + text;
}
function wrapText(text, maxLen) {
  const words = clean(text).split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (test.length > maxLen) {
      if (cur) lines.push(cur);
      cur = w;
    } else cur = test;
  }
  if (cur) lines.push(cur);
  return lines.length ? lines : [''];
}
function lr(left, right) {
  left = clean(left); right = clean(right);
  if (left.length + right.length + 1 > W) {
    const avail = W - right.length - 1;
    const wrapped = wrapText(left, avail);
    const out = wrapped.slice(0, -1);
    const last = wrapped[wrapped.length - 1] || '';
    out.push(last + ' '.repeat(Math.max(1, W - last.length - right.length)) + right);
    return out.join('\n');
  }
  return left + ' '.repeat(W - left.length - right.length) + right;
}
function dashed() { return '-'.repeat(W); }
function solid()  { return '='.repeat(W); }
function fmt(n) {
  return Number(n || 0).toLocaleString('en-US', {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });
}
function money(n) { return fmt(n) + ' CRC'; }

let signatureData = null;

function addItem(desc = '', qty = 1, price = 0) {
  const tbody = document.getElementById('itemsBody');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input type="text" class="i-desc" value="${esc(desc)}" placeholder="Producto"></td>
    <td><input type="number" class="i-qty num" value="${qty}" min="1" step="1"></td>
    <td><input type="number" class="i-price num" value="${price}" min="0" step="0.01"></td>
    <td><button class="btn btn-gray btn-sm" onclick="this.closest('tr').remove(); render();">✕</button></td>
  `;
  tbody.appendChild(tr);
  attachInputs();
  render();
}
function attachInputs() {
  document.querySelectorAll('#itemsBody input').forEach(inp => {
    inp.oninput = render;
    inp.onchange = render;
  });
}
function getItems() {
  const items = [];
  document.querySelectorAll('#itemsBody tr').forEach(tr => {
    const desc = tr.querySelector('.i-desc').value.trim();
    const qty  = parseFloat(tr.querySelector('.i-qty').value) || 0;
    const price = parseFloat(tr.querySelector('.i-price').value) || 0;
    if (desc || qty * price > 0) items.push({ desc, qty, price, total: qty * price });
  });
  return items;
}

function getData() {
  const items = getItems();
  const subtotal = items.reduce((s, i) => s + i.total, 0);
  const taxRate = parseFloat(document.getElementById('taxRate').value) || 0;
  const tax = subtotal * (taxRate / 100);
  const total = subtotal + tax;
  const cashIn = parseFloat(document.getElementById('cashIn').value) || 0;
  const payMethod = document.getElementById('payMethod').value;
  const change = payMethod === 'Efectivo' ? Math.max(0, cashIn - total) : 0;

  const d = document.getElementById('invDate').value;
  let dateStr = '';
  if (d) {
    const [y, m, day] = d.split('-');
    dateStr = `${day}/${m}/${y}`;
  } else {
    const t = new Date();
    dateStr = String(t.getDate()).padStart(2,'0') + '/' +
              String(t.getMonth()+1).padStart(2,'0') + '/' + t.getFullYear();
  }

  return {
    bizName: document.getElementById('bizName').value,
    bizId: document.getElementById('bizId').value,
    bizPhone: document.getElementById('bizPhone').value,
    bizAddr: document.getElementById('bizAddr').value,
    invNum: document.getElementById('invNum').value,
    dateStr,
    cliName: document.getElementById('cliName').value,
    cliId: document.getElementById('cliId').value,
    cliPhone: document.getElementById('cliPhone').value,
    payMethod, items, subtotal, tax, taxRate, total, cashIn, change
  };
}

function buildLines() {
  const d = getData();
  const L = [];

  L.push(center(d.bizName));
  if (d.bizId)    L.push(center('Ced. Juridica: ' + d.bizId));
  if (d.bizPhone) L.push(center('Tel: ' + d.bizPhone));
  if (d.bizAddr)  wrapText(d.bizAddr, W).forEach(l => L.push(center(l)));
  L.push(solid());
  L.push(center('FACTURA ELECTRONICA'));
  L.push(center('No. ' + d.invNum));
  L.push(center('Fecha: ' + d.dateStr));
  L.push(dashed());

  L.push('CLIENTE:');
  wrapText(d.cliName, W - 2).forEach(l => L.push('  ' + l));
  if (d.cliId)    L.push('  Ced: ' + clean(d.cliId));
  if (d.cliPhone) L.push('  Tel: ' + clean(d.cliPhone));
  L.push(dashed());

  L.push(lr('DESCRIPCION', 'TOTAL'));
  L.push(dashed());
  for (const it of d.items) {
    wrapText(it.desc || 'Item', W).forEach(l => L.push(l));
    L.push(lr(`  ${it.qty} x ${fmt(it.price)}`, fmt(it.total)));
  }
  L.push(dashed());

  L.push(lr('Subtotal:', fmt(d.subtotal)));
  L.push(lr(`IVA (${d.taxRate}%):`, fmt(d.tax)));
  L.push(solid());
  L.push(lr('TOTAL:', money(d.total)));
  L.push(solid());

  L.push(lr('Pago:', d.payMethod));
  if (d.payMethod === 'Efectivo') {
    L.push(lr('Recibido:', fmt(d.cashIn)));
    L.push(lr('Vuelto:', fmt(d.change)));
  }
  L.push(dashed());

  L.push(center('________________________'));
  L.push(center('Firma del cliente'));
  L.push('__SIG_PLACEHOLDER__');
  L.push('');

  L.push(center('GRACIAS POR SU COMPRA'));
  L.push(center('Este documento es una prueba'));
  L.push(center('Generado con sistema POS'));
  L.push('');

  return L;
}

function render() {
  const lines = buildLines();
  const ticket = document.getElementById('ticket');
  const html = lines.map(l => {
    if (l === '__SIG_PLACEHOLDER__') {
      if (signatureData) return `<img class="sig" src="${signatureData}" alt="firma">`;
      return '';
    }
    return `<div>${esc(l) || ' '}</div>`;
  }).join('');
  ticket.innerHTML = html;
}

function getTicketText() {
  const lines = buildLines();
  return lines.filter(l => l !== '__SIG_PLACEHOLDER__').join('\n');
}

async function copyTicket() {
  const text = getTicketText();
  try {
    await navigator.clipboard.writeText(text);
    alert('✅ Ticket copiado. Pegalo donde necesites.');
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    alert('✅ Ticket copiado al portapapeles.');
  }
}

document.getElementById('sigFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => { signatureData = ev.target.result; render(); };
  reader.readAsDataURL(file);
});
function clearSig() {
  signatureData = null;
  document.getElementById('sigFile').value = '';
  render();
}

document.addEventListener('DOMContentLoaded', () => {
  const today = new Date();
  document.getElementById('invDate').value =
    today.getFullYear() + '-' +
    String(today.getMonth() + 1).padStart(2, '0') + '-' +
    String(today.getDate()).padStart(2, '0');

  addItem('Cafe molido 500g', 2, 3500);
  addItem('Pan artesanal', 1, 1500);
  addItem('Servicio de envio', 1, 2000);

  document.querySelectorAll('.panel input, .panel select').forEach(el => {
    if (el.id === 'sigFile') return;
    el.addEventListener('input', render);
    el.addEventListener('change', render);
  });

  render();
});
</script>
</body>
</html>
